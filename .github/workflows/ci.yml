name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.txt ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o wormhole .

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verify the image builds on every change; it is only pushed on release.
      - name: Build image
        run: docker build -t wormhole:ci .
